<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>氷華 | Character</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="character-page">

    <header class="header">
        <div class="logo">氷華</div>

        <nav class="nav">
            <a href="index.html">TOP</a>
            <a href="#character">CHARACTER</a>
        </nav>
    </header>

    <main>

        <section class="top-visual sub-visual">
            <div class="top-visual-inner">
                <img
                    src="assets/hero_cast.png"
                    alt="氷華 キャラクタービジュアル"
                    class="top-visual-image"
                >
            </div>

            <div class="top-visual-copy">
                <p class="hero-subtitle">WORLD CHARACTER</p>
                <h1>CHARACTER</h1>
                <p class="hero-description" id="characterPageLead">
                    選択した世界のキャラクター
                </p>
                <a class="main-button" href="index.html#world">BACK TO WORLD</a>
            </div>
        </section>

        <section id="character" class="section">
            <p class="section-subtitle">CHARACTER</p>
            <h2 id="characterWorldTitle">RED WORLD</h2>

            <p class="section-text character-intro" id="characterIntro">
                この世界に属するキャラクターたち。
            </p>

            <div class="character-grid" id="characterList">
            </div>
        </section>

    </main>

    <footer>
        <h2>氷華</h2>
        <p>© 2026 氷華</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
